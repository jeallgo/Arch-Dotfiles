source=$HOME/.config/waybar/waybar.css
background {
  monitor=
  blur_passes=1
  brightness=0.500000
  contrast=0.800000
  crossfade_time=0.500000
  path=$HOME/.cache/current_wallpaper.png
  vignette=0.500000
  vignette_opacity=0.300000
}

general {
  disable_loading=true
  grace=0
  no_fade_in=false
}

input-field {
  monitor=
  size=210, 40
  dots_center=true
  dots_size=0.300000
  dots_spacing=0.150000
  fade_on_empty=false
  font_color=rgb(200, 200, 200)
  halign=center
  hide_input=false
  inner_color=rgba(0, 0, 0, 0.3)
  outer_color=rgba(255, 255, 255, 0.2)
  outline_thickness=2
  placeholder_text=<span foreground="##ffffff99">Password...</span>
  position=0, 100
  valign=bottom
}

label {
  monitor=
  color=@primary
  font_family=JetBrains Mono Nerd Font ExtraBold
  font_size=80
  halign=center
  position=0, 230
  text=cmd[update:1000] echo "$(date +"%H")"
  valign=center
}

label {
  monitor=
  color=@primary
  font_family=JetBrains Mono Nerd Font ExtraBold
  font_size=80
  halign=center
  position=0, 115
  text=cmd[update:1000] echo "$(date +"%M")"
  valign=center
}

label {
  monitor=
  color=rgba(255, 255, 255, 0.6)
  font_family=JetBrains Mono Nerd Font
  font_size=13
  halign=center
  position=0, 35
  text=cmd[update:1000] echo "$(date +"%A, %d %b")"
  valign=center
}
