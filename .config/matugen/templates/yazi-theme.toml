prepend_conds = [
  { if = "dir & hovered", text = "", fg = "{{colors.primary.default.hex}}" },
  { if = "dir", text = "", fg = "{{colors.primary.default.hex}}" },
  { if = "exec", text = "", fg = "{{colors.primary.default.hex}}" },
  { if = "!dir", text = "", fg = "{{colors.on_background.default.hex}}" },
]
