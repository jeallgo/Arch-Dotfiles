prepend_exts = [
  { name = "avif", text = "", fg = "{{colors.secondary.default.hex}}" },
  { name = "bmp", text = "", fg = "{{colors.secondary.default.hex}}" },
  { name = "gif", text = "", fg = "{{colors.secondary.default.hex}}" },
  { name = "ico", text = "", fg = "{{colors.secondary.default.hex}}" },
  { name = "jpeg", text = "", fg = "{{colors.secondary.default.hex}}" },
  { name = "jpg", text = "", fg = "{{colors.secondary.default.hex}}" },
  { name = "jxl", text = "", fg = "{{colors.secondary.default.hex}}" },
  { name = "png", text = "", fg = "{{colors.secondary.default.hex}}" },
  { name = "webp", text = "", fg = "{{colors.secondary.default.hex}}" },
  { name = "raf", text = "", fg = "{{colors.secondary.default.hex}}" },
  { name = "dng", text = "", fg = "{{colors.secondary.default.hex}}" },
  { name = "3gp", text = "", fg = "{{colors.tertiary.default.hex}}" },
  { name = "cast", text = "", fg = "{{colors.tertiary.default.hex}}" },
  { name = "m4v", text = "", fg = "{{colors.tertiary.default.hex}}" },
