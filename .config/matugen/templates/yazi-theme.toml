[mgr]
cwd = { fg = "{{colors.primary.default.hex}}", bold = true }

hovered = { bg = "{{colors.surface_bright.default.hex}}" }
preview_hovered = { underline = true }

find_keyword = { fg = "{{colors.tertiary.default.hex}}", reversed = true }
find_position = { fg = "{{colors.on_background.default.hex}}", bold = true, italic = true }

marker_copied = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
marker_cut = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_selected = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }

count_copied = { fg = "{{colors.on_primary.default.hex}}", bold = true, reversed = true }
count_cut = { fg = "{{colors.on_error.default.hex}}", bold = true, reversed = true }
count_selected = { fg = "{{colors.on_tertiary.default.hex}}", bold = true, reversed = true }

border_symbol = "│"
border_style = { fg = "{{colors.outline.default.hex}}" }

[tabs]
active = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt = { fg = "{{colors.primary.default.hex}}", bg = "reset" }

select_main = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
select_alt = { fg = "{{colors.secondary.default.hex}}", bg = "reset" }

unset_main = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
unset_alt = { fg = "{{colors.tertiary.default.hex}}", bg = "reset" }

[status]
overall = { fg = "{{colors.on_background.default.hex}}" }

perm_type = { fg = "{{colors.primary.default.hex}}" }
perm_read = { fg = "{{colors.tertiary.default.hex}}" }
perm_write = { fg = "{{colors.secondary.default.hex}}" }
perm_exec = { fg = "{{colors.error.default.hex}}" }
perm_sep = { fg = "{{colors.outline.default.hex}}" }

progress_label = { fg = "{{colors.surface.default.hex}}" }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
progress_error = { bg = "{{colors.error.default.hex}}" }

[which]
cols = 3
mask = { bg = "{{colors.surface_container.default.hex}}" }
cand = { fg = "{{colors.primary.default.hex}}", bold = true }
rest = { fg = "{{colors.primary.default.hex}}", italic = true }
desc = { fg = "{{colors.on_background.default.hex}}" }
separator = " "
separator_style = {}

[confirm]
border = { fg = "{{colors.outline.default.hex}}" }
title = { fg = "{{colors.on_background.default.hex}}", bold = true }
content = { fg = "{{colors.on_background.default.hex}}", bold = true }
list = { fg = "{{colors.on_background.default.hex}}" }
btn_yes = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
btn_no = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[spot]
border = { fg = "{{colors.outline.default.hex}}" }
title = { fg = "{{colors.on_background.default.hex}}", bold = true }
tbl_col = { fg = "{{colors.on_background.default.hex}}" }
tbl_cell = { bg = "{{colors.surface_container.default.hex}}" }

[notify]
title_info = { fg = "{{colors.primary.default.hex}}" }
title_warn = { fg = "{{colors.tertiary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

[pick]
border = { fg = "{{colors.outline.default.hex}}", bold = true }
active = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
inactive = { fg = "{{colors.on_background.default.hex}}" }

[input]
border = { fg = "{{colors.outline.default.hex}}" }
title = { fg = "{{colors.on_background.default.hex}}", bold = true }
value = { fg = "{{colors.on_background.default.hex}}" }
selected = { bg = "{{colors.surface_container.default.hex}}" }

[cmp]
border = { fg = "{{colors.outline.default.hex}}", bold = true }
active = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
inactive = { fg = "{{colors.on_background.default.hex}}" }

[tasks]
border = { fg = "{{colors.outline.default.hex}}" }
title = { fg = "{{colors.on_background.default.hex}}", bold = true }
hovered = { bg = "{{colors.surface_container.default.hex}}" }

[help]
on = { fg = "{{colors.primary.default.hex}}" }
run = { fg = "{{colors.secondary.default.hex}}" }
desc = { fg = "{{colors.on_background.default.hex}}", italic = true }
hovered = { bg = "{{colors.surface_container.default.hex}}" }
footer = { fg = "{{colors.on_background.default.hex}}", bg = "{{colors.surface_container.default.hex}}", bold = true }

[filetype]
rules = [
  { mime = "image/*", fg = "{{colors.secondary.default.hex}}" },
  { mime = "video/*", fg = "{{colors.tertiary.default.hex}}" },
  { mime = "audio/*", fg = "{{colors.tertiary.default.hex}}" },
  { url = "*", is = "exec", fg = "{{colors.primary.default.hex}}" },
  { url = "*", is = "orphan", fg = "{{colors.on_background.default.hex}}", crossed = true },
  { url = "*/", is = "orphan", fg = "{{colors.on_background.default.hex}}", crossed = true },
  { url = "*", is = "link", fg = "{{colors.secondary.default.hex}}" },
  { url = "*/", is = "link", fg = "{{colors.secondary.default.hex}}" },
  { url = "*", is = "hidden", fg = "{{colors.on_background.default.hex}}" },
  { url = "*/", is = "hidden", fg = "{{colors.on_background.default.hex}}" },
  { mime = "inode/empty", fg = "{{colors.on_background.default.hex}}" },
  { url = "*", fg = "{{colors.on_background.default.hex}}" },
  { url = "*/", fg = "{{colors.on_background.default.hex}}" },
]

[icon]
prepend_dirs = [
  { name = ".config", text = "", fg = "{{colors.tertiary.default.hex}}" },
  { name = ".git", text = "", fg = "{{colors.primary.default.hex}}" },
  { name = ".github", text = "", fg = "{{colors.primary.default.hex}}" },
  { name = ".npm", text = "", fg = "{{colors.primary.default.hex}}" },
  { name = "Desktop", text = "", fg = "{{colors.primary.default.hex}}" },
  { name = "Development", text = "󱃖", fg = "{{colors.primary.default.hex}}" },
