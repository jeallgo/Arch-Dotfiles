[[manager.prepend_keymap]]
on   = [ "g", "t" ] 
run  = 'cd ~/.local/share/Trash/files'
desc = "Go to Trash"

# Desactivar flechas por completo (cadena vacía)
[[manager.prepend_keymap]]
on   = [ "<Up>" ]
run  = ""

[[manager.prepend_keymap]]
on   = [ "<Down>" ]
run  = ""

[[manager.prepend_keymap]]
on   = [ "<Left>" ]
run  = ""

[[manager.prepend_keymap]]
on   = [ "<Right>" ]
run  = ""
